# Render Blueprint: Dashboard → New → Blueprint → ин репозиторийро интихоб кунед.
# Сохта мешавад: PostgreSQL + ЯК сервис, ки ҳам сайт (Next.js) ва ҳам API (NestJS)-ро иҷро мекунад.
# Чаро як сервис: Render Free дар моҳ 750 соат медиҳад — барои як сервиси доимо бедор кифоя (≤ 744 соат),
# барои ду сервис не. API худаш ҳар 10 дақиқа суроғаи худро мепурсад (KEEP_AWAKE), пас сайт хоб намеравад
# ва кушодани аввал 30–60 сония интизорӣ намегирад. Сайт /api/*-ро ба API дар дохили ҳамин сервис мефиристад.
# Санҷиш: <сайт>/api/health → {"ok":true}.
#
# Базаи Render Free пас аз 30 рӯз нест мешавад. Барои базаи ройгони доимӣ (Neon/Supabase) ниг. docs/specs/14-infra-va-bekhatari.md.

databases:
  - name: filialhub-db
    plan: free
    databaseName: filialhub
    user: filialhub

services:
  - type: web
    name: filialhub-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    # Миграцияҳо + маълумоти намунавӣ (танҳо агар база холӣ бошад) + API (порти дохилии 4100) + сайт ($PORT)
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # API дар ҳамин сервис; ҳангоми build навишта мешавад
      - key: API_URL
        value: http://127.0.0.1:4100
      - key: API_PORT
        value: "4100"
      - key: DATABASE_URL
        fromDatabase:
          name: filialhub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Asia/Dushanbe
      - key: DAILY_REPORT_CRON
        value: "0 0 22 * * *"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # WhatsApp бе Facebook: Green-API (idInstance, apiTokenInstance, apiUrl аз console.green-api.com)
      - key: GREENAPI_ID_INSTANCE
        sync: false
      - key: GREENAPI_API_TOKEN
        sync: false
      - key: GREENAPI_API_URL
        sync: false
      # Green-API Partner: instance барои ҳар бизнес худкор (токен аз support@green-api.com)
      - key: GREENAPI_PARTNER_TOKEN
        sync: false
      - key: GREENAPI_PARTNER_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Шаблони Meta бо матни «{{1}}» — барои паём пас аз 24 соат
      - key: WHATSAPP_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_LANG
        value: ru
      # Супер-админ: почта(ҳо) бо вергул, парол (камаш 8 аломат) ва телефон барои WhatsApp
      - key: SUPERADMIN_EMAILS
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_PHONE
        sync: false
      # Занг дар шабакаҳои мобилӣ: сервери TURN (ихтиёрӣ, ҳангоми build навишта мешавад), масалан turn:turn.example.com:3478
      - key: NEXT_PUBLIC_TURN_URL
        sync: false
      - key: NEXT_PUBLIC_TURN_USERNAME
        sync: false
      - key: NEXT_PUBLIC_TURN_CREDENTIAL
        sync: false
