# Хидмати ройгони Render пас аз 15 дақиқаи бекорӣ мехобад (кушодани аввал 30–60 сония).
# Сайт ва API ҳоло ЯК хидматанд ва API худаш ҳар 10 дақиқа суроғаи худро мепурсад (KEEP_AWAKE дар main.ts).
# Ин workflow — эҳтиёт: агар сервис бо ягон сабаб хоб равад (масалан пас аз хато), онро бедор мекунад.
#
# Танзим: Settings → Secrets and variables → Actions → Variables → New repository variable
#   SITE_URL — суроғаи сайт, масалан https://filialhub-web.onrender.com
#
# Ҳисоби соатҳо: Render ба ҳар workspace 750 соати ройгон дар моҳ медиҳад.
# 1 хидмат × 24 соат × 31 рӯз = 744 соат — дар ҳудуд. Хидмати дуюми бедорро ба ҳамин workspace илова накунед,
# вагарна 750 соат тамом мешавад ва Render хидматҳоро то охири моҳ қатъ мекунад.
# Репозиторий ҷамъиятӣ аст — дақиқаҳои GitHub Actions ройгон ва бемаҳдуданд.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *" # шабонарӯзӣ (GitHub метавонад чанд дақиқа дер кунад)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL гузошта нашудааст — ҳеҷ кор намекунем"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$SITE_URL/api/health"
